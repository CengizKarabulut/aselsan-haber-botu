name: ASELSAN Haber Botu Recovery Watchdog

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_run:
    workflows: ["ASELSAN Cok Kaynakli Haber Botu"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: aselsan-recovery-watchdog
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TRIGGER_EVENT: ${{ github.event_name }}
      SOURCE_EVENT: ${{ github.event.workflow_run.event }}
      SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - name: ASELSAN dongusunu kontrol et ve gerekirse yeniden baslat
        shell: bash
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          runs_json="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/actions/workflows/bist.yml/runs?per_page=20")"

          now_epoch="$(date +%s)"
          recent_any=0
          recent_chain=0

          while IFS=$'\t' read -r event status created_at; do
            [ -z "${created_at:-}" ] && continue
            created_epoch="$(date -d "${created_at}" +%s)"
            age=$((now_epoch - created_epoch))

            if [ "${age}" -lt 1200 ]; then
              recent_any=1
              if [ "${event}" = "repository_dispatch" ] || [ "${event}" = "workflow_dispatch" ]; then
                recent_chain=1
              fi
            fi

            if { [ "${status}" = "queued" ] || [ "${status}" = "in_progress" ]; } && [ "${age}" -lt 1800 ]; then
              recent_any=1
            fi
          done < <(printf '%s' "${runs_json}" | jq -r '.workflow_runs[] | [.event,.status,.created_at] | @tsv')

          # A successful cron check must be able to revive a dead self-chain.
          if [ "${TRIGGER_EVENT}" = "workflow_run" ] && [ "${SOURCE_EVENT:-}" = "schedule" ] && [ "${SOURCE_CONCLUSION:-}" = "success" ]; then
            if [ "${recent_chain}" -eq 1 ]; then
              echo "15 dakikalik zincir zaten yakin zamanda aktif; recovery gerekmiyor."
              exit 0
            fi
            echo "Cron calisti ancak self-chain aktif degil; zincir yeniden baslatiliyor."
          else
            if [ "${recent_any}" -eq 1 ]; then
              echo "ASELSAN kontrolu son 20 dakika icinde calisti veya halen aktif; recovery gerekmiyor."
              exit 0
            fi
            echo "ASELSAN kontrolu 20 dakikadan uzun suredir sessiz; zincir yeniden baslatiliyor."
          fi

          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/dispatches" \
            --data '{"event_type":"aselsan-news-tick"}'

          echo "ASELSAN recovery dispatch basarili."
