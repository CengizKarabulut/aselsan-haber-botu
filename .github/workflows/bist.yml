name: ASELSAN Cok Kaynakli Haber Botu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bist.yml'
      - 'aselsan_news_bot.py'
      - 'aselsan_news_bot_v2.py'
      - 'requirements.txt'
      - 'test_aselsan_news_bot.py'
      - 'test_aselsan_formatting.py'
  schedule:
    - cron: '9 * * * *'
    - cron: '24 * * * *'
    - cron: '39 * * * *'
    - cron: '54 * * * *'
  repository_dispatch:
    types: [aselsan-news-tick]
  workflow_dispatch:

jobs:
  check-news:
    runs-on: ubuntu-latest
    concurrency:
      group: aselsan-multi-source-news-check
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Kodu cek
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Python kur
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Kutuphaneleri yukle
        run: pip install -r requirements.txt
      - name: Testleri calistir
        run: |
          python -m unittest -v test_aselsan_news_bot.py test_aselsan_formatting.py
          python -m py_compile aselsan_news_bot.py aselsan_news_bot_v2.py
      - name: ASELSAN haberlerini cek ve Telegram'a gonder
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        run: python aselsan_news_bot_v2.py
      - name: Cache kaydet
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git pull --rebase --autostash || true
          git add tv_news_cache.json
          if git diff --cached --quiet; then
            echo "Degisiklik yok"
            exit 0
          fi
          git commit -m "ASELSAN haber cache guncellendi [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "Push denemesi ${attempt} basarisiz; tekrar denenecek."
            sleep 5
          done
          exit 1


  trigger-news-to-x:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      NEWS_TO_X_TOKEN: ${{ secrets.NEWS_TO_X_TOKEN }}
      TARGET_REPO: CengizKarabulut/news-to-x
      TARGET_WORKFLOW: news-to-x.yml
    steps:
      - name: news-to-x tetikleyicisini kontrol et
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${NEWS_TO_X_TOKEN:-}" ]; then
            echo "NEWS_TO_X_TOKEN tanimli degil; news-to-x tetiklenmedi."
            exit 0
          fi

          runs_json="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${NEWS_TO_X_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TARGET_REPO}/actions/workflows/${TARGET_WORKFLOW}/runs?per_page=1")"

          latest_status="$(printf '%s' "${runs_json}" | jq -r '.workflow_runs[0].status // "none"')"
          latest_created="$(printf '%s' "${runs_json}" | jq -r '.workflow_runs[0].created_at // ""')"

          if [ "${latest_status}" != "none" ] && [ "${latest_status}" != "completed" ]; then
            echo "news-to-x zaten aktif: ${latest_status}; yeni dispatch atlanacak."
            exit 0
          fi

          if [ -n "${latest_created}" ]; then
            now_epoch="$(date +%s)"
            created_epoch="$(date -d "${latest_created}" +%s)"
            age=$((now_epoch - created_epoch))
            if [ "${age}" -lt 600 ]; then
              echo "news-to-x son 10 dakika icinde calisti; yeni dispatch atlanacak."
              exit 0
            fi
          fi

          echo "news-to-x workflow tetikleniyor."
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${NEWS_TO_X_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TARGET_REPO}/actions/workflows/${TARGET_WORKFLOW}/dispatches" \
            --data '{"ref":"main"}'

          echo "news-to-x dispatch basarili."

  schedule-next:
    needs: check-news
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') }}
    runs-on: ubuntu-latest
    concurrency:
      group: aselsan-multi-source-news-ticker
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - name: Sonraki calismayi tetikle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 900
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            --data '{"event_type":"aselsan-news-tick"}'
